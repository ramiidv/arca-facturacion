name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  # Trusted publishing (OIDC): npm publica sin token y agrega provenance.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing requiere npm >= 11.5.1 (Node 22 trae npm 10).
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:smoke
      - run: npm publish --access public
